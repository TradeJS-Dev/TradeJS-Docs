# Keep old strategy URLs mapped only to articles moved to Marketplace.
map $retired_strategy $has_marketplace_page {
    default 0;
    adaptive-momentum-ribbon 1;
    adaptive-trend-channel 1;
    breakout 1;
    crab 1;
    cup-and-handle 1;
    diamond 1;
    double-tap 1;
    dragon 1;
    flag 1;
    gartley 1;
    grid 1;
    grid-classic 1;
    head-and-shoulders 1;
    hyperliquid-consensus 1;
    imbalance-momentum 1;
    liquidity-tails 1;
    liquidity-zones 1;
    london-breakout 1;
    ma-strategy 1;
    market-flush-reversal 1;
    range-reclaim 1;
    relative-rotation 1;
    reverse-trendline 1;
    structure-zones 1;
    trading-patterns 1;
    trend-follow 1;
    trend-pullback 1;
    trend-shift 1;
    trendline 1;
    triangle 1;
    value-area-reclaim 1;
    volatility-compression-breakout 1;
    volume-divergence 1;
    vwap-reversion 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    error_page 404 /404.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location = /ru/404.html {
        internal;
    }

    location = /ru/ {
        try_files /ru/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~ ^(?<locale>/ru)?/guides/create-simple-strategy/?$ {
        return 301 $locale/strategies/authoring/typescript-strategy-step-by-step$is_args$args;
    }

    location ~ ^(?<locale>/ru)?/guides/pine-workflows/?$ {
        return 301 $locale/strategies/authoring/pine-strategy-step-by-step$is_args$args;
    }

    location ~ ^(?<locale>/ru)?/guides/backtest-strategy/?$ {
        return 301 $locale/runtime/backtesting/overview$is_args$args;
    }

    location ~ ^(?<locale>/ru)?/guides/add-indicators/?$ {
        return 301 $locale/indicators/authoring$is_args$args;
    }

    location ~ ^(?<locale>/ru)?/indicators/pine/?$ {
        return 301 $locale/indicators/authoring$is_args$args;
    }

    location ~ ^/(?:ru/)?strategies/reference(?:/index(?:\.html)?|\.html)?/?$ {
        return 301 https://tradejs.dev/marketplace$is_args$args;
    }

    location ~ ^/(?:ru/)?strategies/reference/(?<retired_strategy>[a-z0-9-]+)(?:\.html)?/?$ {
        if ($has_marketplace_page = 0) {
            return 404;
        }
        return 301 https://tradejs.dev/marketplace/$retired_strategy$is_args$args;
    }

    location ~ ^(.+)/$ {
        # Serve legacy trailing-slash URLs internally; never copy a decoded
        # visitor-controlled path into a Location response header.
        rewrite ^(.+)/$ $1 last;
    }

    location ~* ^/(?:ru/)?assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ru/ {
        error_page 404 /ru/404.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
